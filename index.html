<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d5bd0">
  <meta name="description" content="Clima actual, pronóstico de 5 días y ubicación en tiempo real.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./assets/nube.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="search-box">
        <input type="text" placeholder="Buscar ciudad..." class="input-box" aria-label="Buscar ciudad">

        <button class="icon-btn" id="locationBtn" type="button" title="Usar mi ubicación" aria-label="Usar mi ubicación">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </button>

        <button class="icon-btn" id="searchBtn" type="button" title="Buscar" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>

      <div class="history" id="history" aria-label="Búsquedas recientes"></div>

      <div class="error-banner" id="errorBanner" role="alert" aria-live="assertive"></div>
    </header>

    <div class="loading-state" id="loadingState" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p>Cargando...</p>
    </div>

    <div class="location-not-found">
      <h1>Ubicación no encontrada</h1>
      <img src="./assets/404.png" alt="Error 404">
    </div>

    <section class="weather-body" id="weatherBody">
      <div class="hero-card">
        <div class="place-row">
          <span class="place-name" id="placeName"></span>
          <div class="unit-toggle" id="unitToggle" role="group" aria-label="Unidad de temperatura">
            <button type="button" class="unit-btn is-active" data-unit="C">°C</button>
            <button type="button" class="unit-btn" data-unit="F">°F</button>
          </div>
        </div>

        <img src="./assets/cloud.png" alt="Icono del clima" class="weather-img" id="weatherImg">

        <div class="weather-box">
          <p class="temperature"><span id="temperature">0</span><sup id="unitLabel">°C</sup></p>
          <p class="description" id="description">-</p>
          <p class="feels-like" id="feelsLike"></p>
        </div>
      </div>

      <div class="weather-details" id="weatherDetails">
        <div class="detail">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h9a3 3 0 1 0-3-3"/><path d="M3 12h13a3 3 0 1 1-3 3"/><path d="M3 16h7a2.5 2.5 0 1 1-2.5 2.5"/></svg>
          <div class="text">
            <span id="wind-speed">0Km/H</span>
            <p>Viento</p>
          </div>
        </div>

        <div class="detail">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2s6 7.2 6 11.5a6 6 0 1 1-12 0C6 9.2 12 2 12 2Z"/></svg>
          <div class="text">
            <span id="humidity">0%</span>
            <p>Humedad</p>
          </div>
        </div>

        <div class="detail">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <div class="text">
            <span id="visibility">-</span>
            <p>Visibilidad</p>
          </div>
        </div>

        <div class="detail">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"/><path d="M8 9l4 4 4-4"/><path d="M4 19h16"/></svg>
          <div class="text">
            <span id="pressure">-</span>
            <p>Presión</p>
          </div>
        </div>

        <div class="detail is-optional" id="uviDetail" hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <div class="text">
            <span id="uvIndex">-</span>
            <p>Índice UV</p>
          </div>
        </div>

        <div class="detail is-optional" id="dewPointDetail" hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s6 7.2 6 11.5a6 6 0 1 1-12 0C6 9.2 12 2 12 2Z"/></svg>
          <div class="text">
            <span id="dewPoint">-</span>
            <p>Punto de rocío</p>
          </div>
        </div>
      </div>

      <div class="forecast" id="forecast" aria-label="Pronóstico de 5 días"></div>

      <div class="map-card" id="mapCard" hidden>
        <iframe id="mapFrame" class="map-frame" title="Mapa de la ubicación" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="dayModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
      <div class="modal-header">
        <h2 id="dayModalTitle"></h2>
        <button type="button" class="icon-btn" id="dayModalClose" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
        </button>
      </div>

      <div class="modal-summary">
        <img id="dayModalIcon" alt="">
        <div class="modal-summary-temps">
          <span class="modal-temp" id="dayModalTemp"></span>
          <span class="modal-minmax" id="dayModalMinMax"></span>
        </div>
        <span class="modal-desc" id="dayModalDesc"></span>
      </div>

      <div class="modal-stats" id="dayModalStats"></div>

      <div class="modal-chart" id="dayModalChart" aria-label="Temperatura por hora"></div>

      <div class="modal-hourly" id="dayModalHourly"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
